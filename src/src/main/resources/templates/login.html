<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用语音查询系统登录</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-intro">
        <div class="eyebrow">Voice Query Console</div>
        <h1>通用语音查询系统</h1>
        <p>登录后可使用语音转文本、字段识别、动态 WHERE 条件构造和查询结果展示功能。</p>
        <div class="login-points">
            <span>语音识别</span>
            <span>元数据读取</span>
            <span>权限控制</span>
        </div>
    </section>
    <section class="login-card">
        <h2>管理员登录</h2>
        <p>请输入系统管理员账号和密码。</p>
        <div class="message" th:if="${error}" th:text="${error}">账号或密码错误</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" name="redirect" th:value="${redirect}">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username" placeholder="admin" required>

            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="admin123" required>

            <button class="primary-btn login-submit" type="submit">登录系统</button>
        </form>
        <div class="login-demo">演示账号：admin / admin123</div>
    </section>
</main>
</body>
</html>
